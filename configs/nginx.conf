# ============================================================
# TurboLLM – Nginx Reverse Proxy Configuration
# ============================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    reset_timedout_connection on;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    gzip_min_length 1024;

    # Upstream definitions (multiple inference servers)
    upstream inference_backend {
        # Use least_conn for better distribution under load
        least_conn;
        
        # Server list – adjust IPs/ports as needed
        server inference-1:8000 max_fails=3 fail_timeout=30s;
        server inference-2:8000 max_fails=3 fail_timeout=30s;
        # server inference-3:8000 max_fails=3 fail_timeout=30s;
        
        # Keep alive connections to upstream
        keepalive 32;
    }

    # Enterprise load balancer (if using proprietary module)
    upstream load_balancer_backend {
        server load-balancer:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Main server block
    server {
        listen 80;
        server_name api.turbollm.ai;

        # Redirect HTTP -> HTTPS (if SSL enabled)
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.turbollm.ai;

        # SSL/TLS certificates (mount secrets in container)
        ssl_certificate /etc/nginx/ssl/turbollm.crt;
        ssl_certificate_key /etc/nginx/ssl/turbollm.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health check endpoint (no proxy)
        location /health {
            proxy_pass http://inference_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Metrics endpoint (restricted)
        location /metrics {
            # Allow only internal monitoring (basic auth optional)
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://inference_backend/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Main API endpoints (generate, generate_stream)
        location /generate {
            # Rate limiting: 10 requests per second per client IP
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://inference_backend/generate;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long generation
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # Buffering off for streaming
            proxy_buffering off;
        }

        location /generate_stream {
            # Stream endpoint requires no buffering
            proxy_pass http://inference_backend/generate_stream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for SSE
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # Send events immediately
            chunked_transfer_encoding off;
        }

        # Fallback for any other routes
        location / {
            return 404;
        }

        # Custom error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # Rate limiting zone (shared memory)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
}
