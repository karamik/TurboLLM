# alertmanager.yml
route:
  group_by: ['alertname', 'cluster']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'telegram_and_slack'

receivers:
  - name: 'telegram_and_slack'
    telegram_configs:
      - bot_token: 'YOUR_TELEGRAM_BOT_TOKEN'
        chat_id: YOUR_CHAT_ID
        parse_mode: 'HTML'
        message: |
          {{ range .Alerts }}
          🔔 <b>{{ .Labels.alertname }}</b>
          Severity: {{ .Labels.severity }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
    slack_configs:
      - api_url: 'YOUR_SLACK_WEBHOOK_URL'
        channel: '#alerts'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }} - {{ .Annotations.description }}{{ end }}'

# Опционально: маршрутизация по severity
routes:
  - match:
      severity: 'critical'
    receiver: 'telegram_and_slack'
    continue: true
  - match:
      severity: 'warning'
    receiver: 'telegram_and_slack'
    continue: true
