version: '3.8'

services:
  # ==============================
  # 1. Inference Engine (TurboLLM)
  # ==============================
  inference:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: turbollm-inference
    volumes:
      - ./turbollm:/app/turbollm
      - ./scripts:/app/scripts
      - ./configs:/app/configs
      - ./models:/app/model
      - ./logs:/app/logs
      - ./requirements.txt:/app/requirements.txt
    environment:
      - LOG_LEVEL=DEBUG
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=/app/model
      - QUANTIZATION=fp8
      - KV_CACHE_DTYPE=fp8
      - MAX_MODEL_LEN=32768
    ports:
      - "8000:8000"      # API
      - "5678:5678"      # debugpy (опционально)
    command: >
      python -m turbollm.serve
      --model /app/model
      --port 8000
      --host 0.0.0.0
      --quantization fp8
      --kv-cache-dtype fp8
      --max-model-len 32768
    restart: unless-stopped
    networks:
      - monitor-net

  # ==============================
  # 2. Agent Supervisor (agent_cell.py)
  # ==============================
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: turbollm-agent
    volumes:
      - ./agent_cell.py:/app/agent_cell.py
      - ./logs:/app/logs
      - ./g_inspector:/app/g_inspector
    environment:
      - TURBOLLM_ENDPOINT=http://inference:8000/v1
      - TURBOLLM_MODEL=meta-llama/Meta-Llama-3-70B
      - TURBOLLM_API_KEY=EMPTY
      - CLUSTER_ENDPOINT=http://qrap-node:50051/api/v1/block
      - CLUSTER_API_KEY=
      - CELL_ID=main_cell_01
      - N_AGENTS=10
      - AGENT_HOST=0.0.0.0
      - AGENT_PORT=8080
      - LOG_LEVEL=INFO
      - CONFIDENCE_THRESHOLD_HIGH=0.8
      - CONFIDENCE_THRESHOLD_LOW=0.5
      - MAX_REFLECTION_RETRIES=1
      - INSPECTOR_MODEL_PATH=/app/g_inspector/models/inspector_model.pkl
      - INSPECTOR_SCALER_PATH=/app/g_inspector/models/inspector_scaler.pkl
      - AUTO_TRAIN_INSPECTOR=true
    ports:
      - "8080:8080"      # HTTP API для внешних вызовов
      - "9090:9090"      # Prometheus метрики (агент экспортирует)
    depends_on:
      - inference
    restart: unless-stopped
    networks:
      - monitor-net

  # ==============================
  # 3. Prometheus (сбор метрик)
  # ==============================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"      # внешний доступ (чтобы не конфликтовать с портом агента)
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - monitor-net

  # ==============================
  # 4. Alertmanager (алерты в Telegram/Slack)
  # ==============================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - monitor-net

  # ==============================
  # 5. Grafana (визуализация)
  # ==============================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - monitor-net

  # ==============================
  # 6. Enterprise modules (примеры)
  # ==============================
  load-balancer:
    build:
      context: ./enterprise/load-balancer
    container_name: load-balancer
    volumes:
      - ./enterprise/load-balancer:/app
    environment:
      - DEBUG=true
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - monitor-net

  cache:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - monitor-net

  dashboard:
    build:
      context: ./enterprise/dashboard
    container_name: admin-dashboard
    volumes:
      - ./enterprise/dashboard:/app
    environment:
      - DEBUG=true
    ports:
      - "8082:8080"
    restart: unless-stopped
    networks:
      - monitor-net

# ==============================
# Сети и тома
# ==============================
networks:
  monitor-net:
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
