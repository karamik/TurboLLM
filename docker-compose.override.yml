version: '3.8'

services:
  # Переопределяем сервис inference для разработки
  inference:
    build:
      context: .
      dockerfile: Dockerfile.dev   # можно использовать отдельный Dockerfile для разработки
    # Или используем тот же Dockerfile, но с переопределениями:
    volumes:
      # Монтируем локальный код внутрь контейнера (переопределяет скопированный)
      - ./turbollm:/app/turbollm
      - ./scripts:/app/scripts
      - ./configs:/app/configs
      - ./models:/app/model   # для быстрого доступа к моделям
      - ./logs:/app/logs
      # Монтируем файл зависимостей для переустановки при изменении
      - ./requirements.txt:/app/requirements.txt
    environment:
      - LOG_LEVEL=DEBUG
      - PYTHONUNBUFFERED=1   # для вывода логов в реальном времени
      - MODEL_PATH=/app/model
      - QUANTIZATION=fp8
      - KV_CACHE_DTYPE=fp8
      - MAX_MODEL_LEN=32768
    ports:
      # Добавляем дополнительный порт для дебага (например, для py-spy)
      - "8000:8000"
      - "5678:5678"   # для отладчика (например, debugpy)
    command: >
      python -m turbollm.serve 
      --model /app/model 
      --port 8000 
      --host 0.0.0.0 
      --quantization fp8 
      --kv-cache-dtype fp8 
      --max-model-len 32768
    # Для перезагрузки при изменении кода можно использовать uvicorn с --reload,
    # но это нужно прописать в команде запуска отдельно.

  # Переопределяем прометей для разработки (можно добавить больше метрик)
  prometheus:
    volumes:
      - ./prometheus.dev.yml:/etc/prometheus/prometheus.yml   # отдельный конфиг для разработки
    ports:
      - "9090:9090"

  # Переопределяем графану (можно добавить дашборды локально)
  grafana:
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources

  # Для разработки enterprise модулей можно переопределить их образы на локальные
  load-balancer:
    build:
      context: ./enterprise/load-balancer   # если есть локальный код
    volumes:
      - ./enterprise/load-balancer:/app
    environment:
      - DEBUG=true

  cache:
    ports:
      - "6379:6379"   # доступ к Redis для отладки

  dashboard:
    build:
      context: ./enterprise/dashboard
    volumes:
      - ./enterprise/dashboard:/app
    environment:
      - DEBUG=true
