name: CI - Hardware Attestation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  attestation-test:
    name: Hardware Attestation Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run hardware attestation tests
        run: |
          python -m pytest tests/test_hardware_attestation.py -v

      - name: Run Panopticon simulator tests
        run: |
          python -m pytest tests/test_panopticon.py -v

      - name: Syntax check Python files
        run: |
          python -m py_compile agent_cell.py
          python -m py_compile hardware_attestation.py
          python -m py_compile real_inspector.py
          python -m py_compile panopticon_simulator.py
