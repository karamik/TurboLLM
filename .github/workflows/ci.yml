name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run hardware attestation tests
        run: |
          python -m pytest tests/test_hardware_attestation.py -v

      - name: Syntax check all Python files
        run: |
          python -m py_compile agent_cell.py
          python -m py_compile hardware_attestation.py
          python -m py_compile real_inspector.py
